<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2430; --muted: #5b6572; --line: #dde2e8; --bg: #f7f8fa;
    --card: #ffffff; --accent: #33507a; --danger: #b3413a;
  }
  [data-theme="dark"] {
    --ink: #e8ebef; --muted: #8c96a3; --line: #2a3340; --bg: #12161c;
    --card: #1a2028; --accent: #6f95c9; --danger: #d97066;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
  main { width: 100%; max-width: 560px; margin: 0 auto; padding: 50px 20px 100px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .theme-toggle { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; color: var(--muted); font-family: inherit; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  .theme-toggle:hover { color: var(--ink); border-color: var(--accent); }
  h2.category { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 34px 0 10px; }
  h2.category:first-of-type { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  .tool-link { display: flex; justify-content: space-between; align-items: center; padding: 16px 4px; background: none; border: none; width: 100%; text-align: left; cursor: pointer; color: var(--ink); font-family: inherit; }
  .tool-link:hover .name { color: var(--accent); }
  .name { font-weight: 500; transition: color 0.15s; font-size: 0.95rem; }
  .desc { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .arrow { color: var(--muted); font-size: 1.1rem; flex-shrink: 0; margin-left: 16px; }
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; overflow-y: auto; }
  .overlay.open { display: block; }
  .overlay-inner { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
  .overlay-back { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 0.85rem; cursor: pointer; padding: 0; margin-bottom: 20px; }
  .overlay-back:hover { color: var(--accent); }
  .overlay h2 { font-size: 1.4rem; font-weight: 600; margin: 0 0 24px; }
  input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; font-family: inherit; font-size: 0.9rem; background: var(--card); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button.action { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 9px 16px; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  button.action:hover { opacity: 0.9; }
  button.ghost { background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 9px 14px; color: var(--muted); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .result { font-size: 2rem; font-weight: 700; color: var(--accent); margin-top: 16px; }
  .row { display: grid; grid-template-columns: 1fr 80px 70px 28px; gap: 8px; margin-bottom: 8px; }
  .row input { width: 100%; }
  .remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
  .remove:hover { color: var(--danger); }
  .chrono-wrap { display: flex; align-items: center; gap: 24px; }
  .candle { width: 26px; height: 130px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
  .candle-fill { position: absolute; bottom: 0; width: 100%; background: var(--accent); transition: height 1s linear; }
  .chrono-time { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chrono-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .inline input { width: 90px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  .stats { display: flex; gap: 20px; margin-top: 10px; color: var(--muted); font-size: 0.85rem; }
  .stats b { color: var(--ink); }
  .copy-box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 0.85rem; word-break: break-all; }
  .qr-box { margin-top: 16px; }
  .qr-box img { border-radius: 6px; border: 1px solid var(--line); }
  .color-preview { width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--line); flex-shrink: 0; }
  table.conv { width: 100%; border-collapse: collapse; margin-top: 14px; }
  table.conv td { padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pw-box { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Outils</h1><p class="sub">Petits outils pratiques, gratuits, sans compte.</p></div>
    <button class="theme-toggle" id="themeToggle">Thème sombre</button>
  </div>

  <h2 class="category">Calcul</h2>
  <ul>
    <li><button class="tool-link" data-tool="moyenne"><div><div class="name">Calculateur de moyenne</div><div class="desc">Ajoutez vos notes, ça se sauvegarde</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="pourcentage"><div><div class="name">Calculateur de pourcentage</div><div class="desc">Trouver X % de Y</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="pourboire"><div><div class="name">Calculateur de pourboire</div><div class="desc">Montant et répartition par personne</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="imc"><div><div class="name">Calculateur d'IMC</div><div class="desc">Indice de masse corporelle</div></div><span class="arrow">→</span></button></li>
  </ul>

  <h2 class="category">Temps</h2>
  <ul>
    <li><button class="tool-link" data-tool="chrono"><div><div class="name">Chronomètre</div><div class="desc">Minuteur avec bougie qui descend</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="age"><div><div class="name">Calculateur d'âge</div><div class="desc">Âge exact à partir d'une date de naissance</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="jours"><div><div class="name">Jours entre deux dates</div><div class="desc">Différence en jours</div></div><span class="arrow">→</span></button></li>
  </ul>

  <h2 class="category">Aléatoire</h2>
  <ul>
    <li><button class="tool-link" data-tool="random"><div><div class="name">Nombre aléatoire</div><div class="desc">Tirage au sort dans une plage choisie</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="coin"><div><div class="name">Pile ou face</div><div class="desc">Tirage instantané</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="picker"><div><div class="name">Tirage dans une liste</div><div class="desc">Collez une liste, un élément est tiré au sort</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="dice"><div><div class="name">Lancer de dé</div><div class="desc">D4, D6, D8, D10, D12, D20</div></div><span class="arrow">→</span></button></li>
  </ul>

  <h2 class="category">Texte</h2>
  <ul>
    <li><button class="tool-link" data-tool="wordcount"><div><div class="name">Compteur de mots</div><div class="desc">Mots et caractères en direct</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="case"><div><div class="name">Changer la casse</div><div class="desc">MAJUSCULES, minuscules, Première Lettre</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="lorem"><div><div class="name">Générateur de faux texte</div><div class="desc">Lorem ipsum, longueur ajustable</div></div><span class="arrow">→</span></button></li>
  </ul>

  <h2 class="category">Convertisseurs</h2>
  <ul>
    <li><button class="tool-link" data-tool="color"><div><div class="name">Convertisseur de couleur</div><div class="desc">HEX vers RGB</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="temp"><div><div class="name">Température</div><div class="desc">Celsius, Fahrenheit, Kelvin</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="longueur"><div><div class="name">Longueur</div><div class="desc">Mètres, pieds, pouces, miles</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="base"><div><div class="name">Base numérique</div><div class="desc">Binaire, décimal, hexadécimal</div></div><span class="arrow">→</span></button></li>
  </ul>

  <h2 class="category">Divers</h2>
  <ul>
    <li><button class="tool-link" data-tool="qr"><div><div class="name">Générateur de QR code</div><div class="desc">À partir d'un texte ou lien</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="password"><div><div class="name">Générateur de mot de passe</div><div class="desc">Longueur et options ajustables</div></div><span class="arrow">→</span></button></li>
    <li><button class="tool-link" data-tool="uuid"><div><div class="name">Générateur d'UUID</div><div class="desc">Identifiant unique v4</div></div><span class="arrow">→</span></button></li>
  </ul>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <button class="overlay-back" id="overlayBack">← Retour</button>
    <div id="overlayContent"></div>
  </div>
</div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(t) {
    if (t === 'dark') { root.setAttribute('data-theme', 'dark'); themeToggle.textContent = 'Thème clair'; }
    else { root.removeAttribute('data-theme'); themeToggle.textContent = 'Thème sombre'; }
  }
  applyTheme(localStorage.getItem('theme') || 'light');
  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  const overlay = document.getElementById('overlay');
  const overlayContent = document.getElementById('overlayContent');
  document.getElementById('overlayBack').addEventListener('click', () => {
    overlay.classList.remove('open');
    overlayContent.innerHTML = '';
  });

  const templates = {
    moyenne: {
      title: 'Calculateur de moyenne',
      html: `<div id="rows"></div><button class="ghost" id="addRow" style="margin-top:6px;">+ Ajouter une ligne</button><div class="result" id="avgValue">-</div>`,
      init() {
        const rowsEl = document.getElementById('rows');
        const avgEl = document.getElementById('avgValue');
        function loadRows() { const s = localStorage.getItem('moyenne_data'); return s ? JSON.parse(s) : [{ label: '', note: '', coef: '1' }]; }
        function saveRows() {
          const data = [...rowsEl.children].map(row => ({ label: row.querySelector('.label').value, note: row.querySelector('.note').value, coef: row.querySelector('.coef').value }));
          localStorage.setItem('moyenne_data', JSON.stringify(data));
          computeAvg();
        }
        function computeAvg() {
          let total = 0, coefSum = 0;
          rowsEl.querySelectorAll('.row').forEach(row => {
            const note = parseFloat(row.querySelector('.note').value);
            const coef = parseFloat(row.querySelector('.coef').value) || 1;
            if (!isNaN(note)) { total += note * coef; coefSum += coef; }
          });
          avgEl.textContent = coefSum > 0 ? (total / coefSum).toFixed(2) : '-';
        }
        function addRow(data = { label: '', note: '', coef: '1' }) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<input class="label" type="text" placeholder="Nom" value="${data.label}"><input class="note" type="number" step="0.01" placeholder="/20" value="${data.note}"><input class="coef" type="number" step="0.5" placeholder="1" value="${data.coef}"><button class="remove">×</button>`;
          row.querySelectorAll('input').forEach(i => i.addEventListener('input', saveRows));
          row.querySelector('.remove').addEventListener('click', () => { row.remove(); saveRows(); });
          rowsEl.appendChild(row);
        }
        document.getElementById('addRow').addEventListener('click', () => { addRow(); saveRows(); });
        loadRows().forEach(d => addRow(d));
        computeAvg();
      }
    },
    pourcentage: {
      title: 'Calculateur de pourcentage',
      html: `<p style="color:var(--muted);font-size:0.9rem;margin-top:0;">Quel est X % de Y ?</p><div class="inline"><input type="number" id="pA" placeholder="X"><span>% de</span><input type="number" id="pB" placeholder="Y"><button class="action" id="pCalc">Calculer</button></div><div class="result" id="pResult">-</div>`,
      init() {
        document.getElementById('pCalc').addEventListener('click', () => {
          const a = parseFloat(document.getElementById('pA').value), b = parseFloat(document.getElementById('pB').value);
          document.getElementById('pResult').textContent = (!isNaN(a) && !isNaN(b)) ? ((a / 100) * b).toFixed(2) : '-';
        });
      }
    },
    pourboire: {
      title: 'Calculateur de pourboire',
      html: `<div class="grid2"><input type="number" id="tipBill" placeholder="Addition (€)"><input type="number" id="tipPct" placeholder="Pourboire %" value="10"></div><input type="number" id="tipPeople" placeholder="Nb de personnes" value="1" style="margin-top:10px;width:100%;"><div class="result" id="tipResult">-</div>`,
      init() {
        function calc() {
          const bill = parseFloat(document.getElementById('tipBill').value);
          const pct = parseFloat(document.getElementById('tipPct').value);
          const people = parseFloat(document.getElementById('tipPeople').value) || 1;
          const r = document.getElementById('tipResult');
          if (isNaN(bill) || isNaN(pct)) { r.textContent = '-'; return; }
          const total = bill * (1 + pct / 100);
          r.textContent = (total / people).toFixed(2) + ' € / pers.';
        }
        ['tipBill','tipPct','tipPeople'].forEach(id => document.getElementById(id).addEventListener('input', calc));
      }
    },
    imc: {
      title: "Calculateur d'IMC",
      html: `<div class="grid2"><input type="number" id="imcPoids" placeholder="Poids (kg)"><input type="number" id="imcTaille" placeholder="Taille (cm)"></div><div class="result" id="imcResult">-</div>`,
      init() {
        function calc() {
          const p = parseFloat(document.getElementById('imcPoids').value);
          const t = parseFloat(document.getElementById('imcTaille').value) / 100;
          const r = document.getElementById('imcResult');
          if (isNaN(p) || isNaN(t) || t === 0) { r.textContent = '-'; return; }
          r.textContent = (p / (t * t)).toFixed(1);
        }
        ['imcPoids','imcTaille'].forEach(id => document.getElementById(id).addEventListener('input', calc));
      }
    },
    chrono: {
      title: 'Chronomètre',
      html: `<div class="chrono-wrap"><div class="candle"><div class="candle-fill" id="candleFill" style="height:100%;"></div></div><div><div class="chrono-time" id="chronoTime">00:00</div><div class="inline" style="margin-top:8px;"><input type="number" id="chronoMinutes" placeholder="Minutes" min="0" value="5"></div><div class="chrono-controls"><button class="action" id="chronoStart">Démarrer</button><button class="ghost" id="chronoReset">Réinitialiser</button></div></div></div>`,
      init() {
        let chronoInterval = null, chronoTotal = 0, chronoRemaining = 0;
        const chronoTimeEl = document.getElementById('chronoTime');
        const candleFill = document.getElementById('candleFill');
        const chronoStartBtn = document.getElementById('chronoStart');
        function formatTime(s) { const m = Math.floor(s / 60).toString().padStart(2, '0'); const sec = (s % 60).toString().padStart(2, '0'); return `${m}:${sec}`; }
        function updateChronoDisplay() {
          chronoTimeEl.textContent = formatTime(chronoRemaining);
          const pct = chronoTotal > 0 ? (chronoRemaining / chronoTotal) * 100 : 100;
          candleFill.style.height = pct + '%';
        }
        chronoStartBtn.addEventListener('click', () => {
          if (chronoInterval) { clearInterval(chronoInterval); chronoInterval = null; chronoStartBtn.textContent = 'Démarrer'; return; }
          if (chronoRemaining <= 0) {
            const minutes = parseFloat(document.getElementById('chronoMinutes').value) || 0;
            chronoTotal = Math.round(minutes * 60);
            chronoRemaining = chronoTotal;
          }
          chronoStartBtn.textContent = 'Pause';
          chronoInterval = setInterval(() => {
            chronoRemaining--;
            updateChronoDisplay();
            if (chronoRemaining <= 0) { clearInterval(chronoInterval); chronoInterval = null; chronoStartBtn.textContent = 'Démarrer'; }
          }, 1000);
        });
        document.getElementById('chronoReset').addEventListener('click', () => {
          clearInterval(chronoInterval); chronoInterval = null; chronoStartBtn.textContent = 'Démarrer';
          chronoTotal = 0; chronoRemaining = 0; updateChronoDisplay();
        });
        updateChronoDisplay();
      }
    },
    age: {
      title: "Calculateur d'âge",
      html: `<input type="date" id="birthDate"><button class="action" id="ageCalc" style="margin-left:8px;">Calculer</button><div class="result" id="ageResult">-</div>`,
      init() {
        document.getElementById('ageCalc').addEventListener('click', () => {
          const val = document.getElementById('birthDate').value;
          const r = document.getElementById('ageResult');
          if (!val) { r.textContent = '-'; return; }
          const birth = new Date(val), now = new Date();
          let age = now.getFullYear() - birth.getFullYear();
          const m = now.getMonth() - birth.getMonth();
          if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
          r.textContent = age + ' ans';
        });
      }
    },
    jours: {
      title: 'Jours entre deux dates',
      html: `<div class="grid2"><input type="date" id="dateA"><input type="date" id="dateB"></div><div class="result" id="joursResult">-</div>`,
      init() {
        function calc() {
          const a = document.getElementById('dateA').value, b = document.getElementById('dateB').value;
          const r = document.getElementById('joursResult');
          if (!a || !b) { r.textContent = '-'; return; }
          const diff = Math.abs(new Date(b) - new Date(a)) / 86400000;
          r.textContent = Math.round(diff) + ' jours';
        }
        ['dateA','dateB'].forEach(id => document.getElementById(id).addEventListener('input', calc));
      }
    },
    random: {
      title: 'Nombre aléatoire',
      html: `<div class="inline"><input type="number" id="randMin" placeholder="Min" value="1"><span>à</span><input type="number" id="randMax" placeholder="Max" value="100"><button class="action" id="randBtn">Tirer</button></div><div class="result" id="randResult">-</div>`,
      init() {
        document.getElementById('randBtn').addEventListener('click', () => {
          const min = parseInt(document.getElementById('randMin').value), max = parseInt(document.getElementById('randMax').value);
          const result = document.getElementById('randResult');
          if (isNaN(min) || isNaN(max) || min > max) { result.textContent = 'Plage invalide'; return; }
          result.textContent = Math.floor(Math.random() * (max - min + 1)) + min;
        });
      }
    },
    coin: {
      title: 'Pile ou face',
      html: `<button class="action" id="coinBtn">Lancer</button><div class="result" id="coinResult">-</div>`,
      init() { document.getElementById('coinBtn').addEventListener('click', () => { document.getElementById('coinResult').textContent = Math.random() < 0.5 ? 'Pile' : 'Face'; }); }
    },
    picker: {
      title: 'Tirage dans une liste',
      html: `<textarea id="pickerList" placeholder="Un élément par ligne..."></textarea><button class="action" id="pickerBtn" style="margin-top:10px;">Tirer au sort</button><div class="result" id="pickerResult">-</div>`,
      init() {
        document.getElementById('pickerBtn').addEventListener('click', () => {
          const lines = document.getElementById('pickerList').value.split('\n').map(l => l.trim()).filter(Boolean);
          document.getElementById('pickerResult').textContent = lines.length ? lines[Math.floor(Math.random() * lines.length)] : '-';
        });
      }
    },
    dice: {
      title: 'Lancer de dé',
      html: `<div class="inline"><select id="diceType"><option value="4">D4</option><option value="6" selected>D6</option><option value="8">D8</option><option value="10">D10</option><option value="12">D12</option><option value="20">D20</option></select><button class="action" id="diceBtn">Lancer</button></div><div class="result" id="diceResult">-</div>`,
      init() {
        document.getElementById('diceBtn').addEventListener('click', () => {
          const sides = parseInt(document.getElementById('diceType').value);
          document.getElementById('diceResult').textContent = Math.floor(Math.random() * sides) + 1;
        });
      }
    },
    wordcount: {
      title: 'Compteur de mots',
      html: `<textarea id="textInput" placeholder="Collez ou tapez votre texte ici..."></textarea><div class="stats"><span>Mots : <b id="wordCount">0</b></span><span>Caractères : <b id="charCount">0</b></span></div>`,
      init() {
        const textInput = document.getElementById('textInput');
        textInput.addEventListener('input', () => {
          const val = textInput.value;
          document.getElementById('charCount').textContent = val.length;
          document.getElementById('wordCount').textContent = val.trim() === '' ? 0 : val.trim().split(/\s+/).length;
        });
      }
    },
    case: {
      title: 'Changer la casse',
      html: `<textarea id="caseInput" placeholder="Votre texte..."></textarea><div class="chrono-controls"><button class="ghost" id="caseUpper">MAJUSCULES</button><button class="ghost" id="caseLower">minuscules</button><button class="ghost" id="caseTitle">Première Lettre</button></div>`,
      init() {
        const el = document.getElementById('caseInput');
        document.getElementById('caseUpper').addEventListener('click', () => el.value = el.value.toUpperCase());
        document.getElementById('caseLower').addEventListener('click', () => el.value = el.value.toLowerCase());
        document.getElementById('caseTitle').addEventListener('click', () => { el.value = el.value.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase()); });
      }
    },
    lorem: {
      title: 'Générateur de faux texte',
      html: `<div class="inline"><input type="number" id="loremCount" placeholder="Nb de phrases" value="3"><button class="action" id="loremBtn">Générer</button></div><textarea id="loremOut" style="margin-top:12px;" readonly></textarea>`,
      init() {
        const words = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat".split(' ');
        document.getElementById('loremBtn').addEventListener('click', () => {
          const n = parseInt(document.getElementById('loremCount').value) || 1;
          let out = [];
          for (let i = 0; i < n; i++) {
            let len = 8 + Math.floor(Math.random() * 8);
            let s = [];
            for (let j = 0; j < len; j++) s.push(words[Math.floor(Math.random() * words.length)]);
            s[0] = s[0].charAt(0).toUpperCase() + s[0].slice(1);
            out.push(s.join(' ') + '.');
          }
          document.getElementById('loremOut').value = out.join(' ');
        });
      }
    },
    color: {
      title: 'Convertisseur de couleur',
      html: `<div class="inline"><input type="text" id="colorHex" placeholder="#33507a" value="#33507a"><div class="color-preview" id="colorPreview"></div></div><div class="copy-box" id="colorRgb" style="margin-top:12px;">-</div>`,
      init() {
        const hexInput = document.getElementById('colorHex'), preview = document.getElementById('colorPreview'), rgbBox = document.getElementById('colorRgb');
        function update() {
          const hex = hexInput.value.trim();
          if (!/^#([0-9A-Fa-f]{6})$/.test(hex)) { rgbBox.textContent = 'HEX invalide'; return; }
          const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
          preview.style.background = hex;
          rgbBox.textContent = `rgb(${r}, ${g}, ${b})`;
        }
        hexInput.addEventListener('input', update);
        update();
      }
    },
    temp: {
      title: 'Convertisseur de température',
      html: `<input type="number" id="tempC" placeholder="Celsius"><table class="conv"><tr><td>Fahrenheit</td><td id="tempF">-</td></tr><tr><td>Kelvin</td><td id="tempK">-</td></tr></table>`,
      init() {
        document.getElementById('tempC').addEventListener('input', () => {
          const c = parseFloat(document.getElementById('tempC').value);
          document.getElementById('tempF').textContent = isNaN(c) ? '-' : (c * 9/5 + 32).toFixed(1) + ' °F';
          document.getElementById('tempK').textContent = isNaN(c) ? '-' : (c + 273.15).toFixed(1) + ' K';
        });
      }
    },
    longueur: {
      title: 'Convertisseur de longueur',
      html: `<input type="number" id="lenM" placeholder="Mètres"><table class="conv"><tr><td>Pieds</td><td id="lenFt">-</td></tr><tr><td>Pouces</td><td id="lenIn">-</td></tr><tr><td>Miles</td><td id="lenMi">-</td></tr></table>`,
      init() {
        document.getElementById('lenM').addEventListener('input', () => {
          const m = parseFloat(document.getElementById('lenM').value);
          document.getElementById('lenFt').textContent = isNaN(m) ? '-' : (m * 3.28084).toFixed(2) + ' ft';
          document.getElementById('lenIn').textContent = isNaN(m) ? '-' : (m * 39.3701).toFixed(2) + ' in';
          document.getElementById('lenMi').textContent = isNaN(m) ? '-' : (m / 1609.34).toFixed(4) + ' mi';
        });
      }
    },
    base: {
      title: 'Convertisseur de base numérique',
      html: `<input type="number" id="baseDec" placeholder="Décimal"><table class="conv"><tr><td>Binaire</td><td id="baseBin">-</td></tr><tr><td>Hexadécimal</td><td id="baseHex">-</td></tr><tr><td>Octal</td><td id="baseOct">-</td></tr></table>`,
      init() {
        document.getElementById('baseDec').addEventListener('input', () => {
          const n = parseInt(document.getElementById('baseDec').value);
          document.getElementById('baseBin').textContent = isNaN(n) ? '-' : n.toString(2);
          document.getElementById('baseHex').textContent = isNaN(n) ? '-' : n.toString(16).toUpperCase();
          document.getElementById('baseOct').textContent = isNaN(n) ? '-' : n.toString(8);
        });
      }
    },
    qr: {
      title: 'Générateur de QR code',
      html: `<input type="text" id="qrInput" placeholder="Texte ou lien..." style="width:100%;"><button class="action" id="qrBtn" style="margin-top:10px;">Générer</button><div class="qr-box" id="qrBox"></div>`,
      init() {
        document.getElementById('qrBtn').addEventListener('click', () => {
          const val = document.getElementById('qrInput').value.trim();
          const box = document.getElementById('qrBox');
          if (!val) { box.innerHTML = ''; return; }
          box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(val)}" width="200" height="200" alt="QR code">`;
        });
      }
    },
    password: {
      title: 'Générateur de mot de passe',
      html: `<div class="inline"><input type="number" id="pwLen" value="16" style="width:70px;"><label style="font-size:0.85rem;color:var(--muted);"><input type="checkbox" id="pwSym" checked> Symboles</label></div><div class="pw-box" style="margin-top:14px;"><div class="copy-box" id="pwOut" style="flex:1;">-</div><button class="action" id="pwBtn">Générer</button></div>`,
      init() {
        document.getElementById('pwBtn').addEventListener('click', () => {
          const len = parseInt(document.getElementById('pwLen').value) || 16;
          const useSym = document.getElementById('pwSym').checked;
          let chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
          if (useSym) chars += '!@#$%^&*-_=+';
          let pw = '';
          for (let i = 0; i < len; i++) pw += chars[Math.floor(Math.random() * chars.length)];
          document.getElementById('pwOut').textContent = pw;
        });
      }
    },
    uuid: {
      title: "Générateur d'UUID",
      html: `<button class="action" id="uuidBtn">Générer</button><div class="copy-box" id="uuidOut" style="margin-top:14px;">-</div>`,
      init() {
        document.getElementById('uuidBtn').addEventListener('click', () => {
          const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
          document.getElementById('uuidOut').textContent = uuid;
        });
      }
    }
  };

  document.querySelectorAll('.tool-link').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = templates[btn.dataset.tool];
      if (!t) return;
      overlayContent.innerHTML = `<h2>${t.title}</h2>${t.html}`;
      overlay.classList.add('open');
      t.init();
    });
  });
</script>
</body>
</html>
